<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Security - SRM AP DayPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="admin.html">🎓 SRM AP DayPass</a>
        <div class="ms-auto d-flex gap-2">
            <a href="admin.html" class="btn btn-outline-primary btn-sm">Dashboard</a>
            <button class="btn btn-primary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container page-wrap">
    <div class="welcome">
        <h1>QR Security Verification</h1>
        <p class="mb-0">Scan a student's temporary DayPass QR code.</p>
    </div>

    <div class="panel">
        <div id="scanner" class="scanner-box"></div>

        <div class="d-flex flex-wrap gap-2 mt-3">
            <button id="startButton" class="btn btn-primary">Start Camera</button>
            <button id="stopButton" class="btn btn-outline-danger">Stop Camera</button>
        </div>

        <hr>

        <h5>Upload QR Image</h5>
        <input id="qrFile" type="file" accept="image/*" class="form-control">
        <div id="uploadReader" class="d-none"></div>

        <hr>

        <h5>Manual QR Data</h5>
        <div class="input-group">
            <input id="manualQr" class="form-control" placeholder="Paste QR text">
            <button class="btn btn-outline-primary" onclick="verifyQr(document.getElementById('manualQr').value)">
                Verify
            </button>
        </div>

        <div id="result"></div>
    </div>
</main>

<script>
let scanner = null;
let isRunning = false;

async function initPage() {
    try {
        await requireRole("admin");
    } catch (error) {
        console.error(error);
    }
}

function showResult(type, html) {
    const box = document.getElementById("result");
    box.className = `result-box ${type === "success" ? "result-success" : "result-error"}`;
    box.innerHTML = html;
}

async function verifyQr(qrData) {
    qrData = String(qrData || "").trim();

    if (!qrData) {
        showResult("error", "<strong>Error:</strong> QR data is empty.");
        return;
    }

    showResult("success", "Verifying QR code...");

    try {
        const verification = await apiRequest("/api/verify-qr", {
            method: "POST",
            body: JSON.stringify({ qrData })
        });

        const student = verification.student;

        const entry = await apiRequest("/api/entries", {
            method: "POST",
            body: JSON.stringify({
                studentId: student.studentId,
                entryType: "ENTRY"
            })
        });

        showResult("success", `
            <h5>✓ Entry Verified</h5>
            <p class="mb-1"><strong>Name:</strong> ${escapeHtml(student.name)}</p>
            <p class="mb-1"><strong>Student ID:</strong> ${escapeHtml(student.studentId)}</p>
            <p class="mb-1"><strong>Email:</strong> ${escapeHtml(student.email)}</p>
            <p class="mb-0"><strong>Entry:</strong> Recorded successfully</p>
        `);

        document.getElementById("manualQr").value = "";
    } catch (error) {
        console.error(error);
        showResult("error", `<strong>Verification failed:</strong> ${escapeHtml(error.message)}`);
    }
}

async function startScanner() {
    if (isRunning) return;

    scanner = new Html5Qrcode("scanner");

    try {
        await scanner.start(
            { facingMode: "environment" },
            {
                fps: 10,
                qrbox: { width: 250, height: 250 }
            },
            async decodedText => {
                await stopScanner();
                await verifyQr(decodedText);
            },
            () => {}
        );

        isRunning = true;
    } catch (error) {
        console.error(error);
        showResult("error",
            "Camera could not start. Allow camera permission or use QR image upload/manual data."
        );
    }
}

async function stopScanner() {
    if (!scanner || !isRunning) return;

    try {
        await scanner.stop();
        await scanner.clear();
    } catch (error) {
        console.warn(error);
    }

    isRunning = false;
}

document.getElementById("startButton").addEventListener("click", startScanner);
document.getElementById("stopButton").addEventListener("click", stopScanner);

document.getElementById("qrFile").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new Html5Qrcode("uploadReader");

    try {
        const decodedText = await reader.scanFile(file, true);
        await verifyQr(decodedText);
    } catch (error) {
        showResult("error", "Could not read a QR code from this image.");
    }
});

initPage();
</script>

</body>
</html>
