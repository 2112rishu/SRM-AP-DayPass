<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SRM AP DayPass - Security</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .scanner-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        #video {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            background: #000;
        }

        #canvas {
            display: none;
        }

        .result-box {
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .success-box {
            background: #d1e7dd;
            color: #0f5132;
        }

        .error-box {
            background: #f8d7da;
            color: #842029;
        }

        .info-box {
            background: #cff4fc;
            color: #055160;
        }

        .preview {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                SRM AP DayPass
            </a>

            <button class="btn btn-outline-light btn-sm" onclick="logout()">
                Logout
            </button>
        </div>
    </nav>

    <div class="container py-4">

        <div class="text-center mb-4">
            <h2>Security Verification</h2>
            <p class="text-muted">
                Verify student QR code before allowing entry
            </p>
        </div>

        <!-- CAMERA SCANNER -->
        <div class="scanner-box mb-4">

            <h4>📷 Scan QR Using Camera</h4>

            <div class="text-center mt-3">

                <video id="video" autoplay playsinline></video>

                <canvas id="canvas"></canvas>

                <div class="mt-3">

                    <button id="startCameraBtn"
                            class="btn btn-primary"
                            onclick="startCamera()">
                        Start Camera
                    </button>

                    <button id="stopCameraBtn"
                            class="btn btn-danger"
                            onclick="stopCamera()"
                            disabled>
                        Stop Camera
                    </button>

                </div>

            </div>

        </div>

        <!-- GALLERY -->
        <div class="scanner-box mb-4">

            <h4>🖼️ Scan From Gallery</h4>

            <p class="text-muted">
                Upload a screenshot or image containing the student's QR code.
            </p>

            <input
                type="file"
                id="imageInput"
                class="form-control"
                accept="image/*"
                onchange="scanImage(event)"
            >

            <div class="text-center">

                <img
                    id="preview"
                    class="preview"
                    style="display:none;"
                >

            </div>

        </div>

        <!-- MANUAL -->
        <div class="scanner-box mb-4">

            <h4>⌨️ Manual Student ID Verification</h4>

            <p class="text-muted">
                Enter the student's ID if QR scanning is unavailable.
            </p>

            <div class="input-group">

                <input
                    type="text"
                    id="studentIdInput"
                    class="form-control"
                    placeholder="Example: SRMAP-STU-1001"
                >

                <button
                    class="btn btn-dark"
                    onclick="verifyManual()">
                    Verify
                </button>

            </div>

        </div>

        <!-- RESULT -->
        <div id="result"></div>

    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>

    <!-- QR decoder -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <script>

        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let ctx = canvas.getContext("2d");

        let stream = null;
        let scanning = false;

        /*
         * Wait for Firebase authentication
         */
        auth.onAuthStateChanged(async (user) => {

            if (!user) {

                window.location.href = "admin-login.html";
                return;

            }

            console.log("Logged in as:", user.email);

        });


        /*
         * Show result
         */
        function showResult(type, title, message, details = "") {

            const result = document.getElementById("result");

            result.className = "result-box " + type;

            result.innerHTML = `
                <h4>${title}</h4>
                <p class="mb-1">${message}</p>
                ${details}
            `;

            result.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }


        /*
         * Get Firebase token
         */
        async function getToken() {

            const user = auth.currentUser;

            if (!user) {
                throw new Error("You are not logged in.");
            }

            return await user.getIdToken(true);
        }


        /*
         * VERIFY STUDENT
         */
        async function verifyStudent(studentId) {

            if (!studentId) {

                showResult(
                    "error-box",
                    "❌ Invalid QR",
                    "Student ID was not found."
                );

                return;

            }

            studentId = studentId.trim();

            showResult(
                "info-box",
                "⏳ Verifying...",
                "Please wait while we verify the student."
            );

            try {

                const token = await getToken();

                console.log("Sending verification request:", studentId);

                const response = await fetch("/api/verify-qr", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },

                    body: JSON.stringify({
                        studentId: studentId
                    })

                });

                /*
                 * Read response safely
                 */
                const text = await response.text();

                console.log("Server response:", response.status, text);

                let data = {};

                try {
                    data = JSON.parse(text);
                } catch (e) {

                    data = {
                        success: false,
                        message: text || "Invalid server response."
                    };

                }


                /*
                 * SUCCESS
                 */
                if (response.ok && data.success) {

                    const entry = data.entry || {};

                    showResult(
                        "success-box",
                        "✅ Entry Successful",
                        data.message || "Student verified successfully.",
                        `
                        <hr>
                        <strong>Student:</strong>
                        ${escapeHtml(entry.name || "N/A")}
                        <br>

                        <strong>Student ID:</strong>
                        ${escapeHtml(entry.studentId || studentId)}
                        <br>

                        <strong>Entry:</strong>
                        ${entry.entryNumber || "N/A"} / ${entry.entryLimit || 3}
                        <br>

                        <strong>Remaining Entries:</strong>
                        ${entry.remainingEntries ?? "N/A"}
                        <br>

                        <strong>Date:</strong>
                        ${escapeHtml(entry.date || "N/A")}
                        `
                    );

                    return;
                }


                /*
                 * DAILY LIMIT
                 */
                if (response.status === 429) {

                    showResult(
                        "error-box",
                        "🚫 Daily Limit Reached",
                        data.message ||
                        "Maximum 3 entries allowed per day.",
                        `
                        <hr>
                        <strong>Entry Limit:</strong>
                        ${data.entryLimit ?? 3}
                        <br>
                        <strong>Remaining:</strong>
                        ${data.remainingEntries ?? 0}
                        `
                    );

                    return;
                }


                /*
                 * BLOCKED / OTHER ERROR
                 */
                showResult(
                    "error-box",
                    "❌ Verification Failed",
                    data.message || "Student verification failed."
                );

            } catch (error) {

                console.error("Verification error:", error);

                showResult(
                    "error-box",
                    "❌ Unable to Connect",
                    error.message ||
                    "Unable to connect to verification server."
                );

            }

        }


        /*
         * Parse QR data
         */
        function processQR(qrText) {

            console.log("QR data:", qrText);

            try {

                const data = JSON.parse(qrText);

                if (data.studentId) {

                    verifyStudent(data.studentId);

                    return;

                }

            } catch (error) {

                console.log("QR is not JSON.");

            }


            /*
             * If QR directly contains Student ID
             */
            if (qrText && qrText.trim()) {

                verifyStudent(qrText.trim());

                return;

            }


            showResult(
                "error-box",
                "❌ Invalid QR",
                "Could not find a Student ID in this QR code."
            );

        }


        /*
         * START CAMERA
         */
        async function startCamera() {

            if (scanning) return;

            try {

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment"
                    },
                    audio: false
                });

                video.srcObject = stream;

                scanning = true;

                document.getElementById("startCameraBtn").disabled = true;
                document.getElementById("stopCameraBtn").disabled = false;

                requestAnimationFrame(scanCamera);

            } catch (error) {

                console.error(error);

                showResult(
                    "error-box",
                    "❌ Camera Error",
                    "Unable to access camera. Please allow camera permission."
                );

            }

        }


        /*
         * SCAN CAMERA
         */
        function scanCamera() {

            if (!scanning) return;

            if (
                video.readyState === video.HAVE_ENOUGH_DATA
            ) {

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                const imageData = ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                const code = jsQR(
                    imageData.data,
                    imageData.width,
                    imageData.height
                );

                if (code) {

                    console.log("QR detected:", code.data);

                    stopCamera();

                    processQR(code.data);

                    return;

                }

            }

            requestAnimationFrame(scanCamera);

        }


        /*
         * STOP CAMERA
         */
        function stopCamera() {

            scanning = false;

            if (stream) {

                stream.getTracks().forEach(track => {
                    track.stop();
                });

                stream = null;

            }

            video.srcObject = null;

            document.getElementById("startCameraBtn").disabled = false;
            document.getElementById("stopCameraBtn").disabled = true;

        }


        /*
         * GALLERY IMAGE SCAN
         */
        function scanImage(event) {

            const file = event.target.files[0];

            if (!file) return;

            const preview = document.getElementById("preview");

            const reader = new FileReader();

            reader.onload = function(e) {

                preview.src = e.target.result;
                preview.style.display = "block";

                const img = new Image();

                img.onload = function() {

                    const tempCanvas = document.createElement("canvas");

                    const tempCtx = tempCanvas.getContext("2d");

                    tempCanvas.width = img.width;
                    tempCanvas.height = img.height;

                    tempCtx.drawImage(
                        img,
                        0,
                        0
                    );

                    const imageData = tempCtx.getImageData(
                        0,
                        0,
                        tempCanvas.width,
                        tempCanvas.height
                    );

                    const code = jsQR(
                        imageData.data,
                        imageData.width,
                        imageData.height
                    );

                    if (code) {

                        console.log("Gallery QR:", code.data);

                        processQR(code.data);

                    } else {

                        showResult(
                            "error-box",
                            "❌ QR Not Found",
                            "No readable QR code was found in this image."
                        );

                    }

                };

                img.src = e.target.result;

            };

            reader.readAsDataURL(file);

        }


        /*
         * MANUAL VERIFICATION
         */
        function verifyManual() {

            const input =
                document.getElementById("studentIdInput");

            const studentId =
                input.value.trim();

            if (!studentId) {

                showResult(
                    "error-box",
                    "❌ Student ID Required",
                    "Please enter a Student ID."
                );

                return;

            }

            verifyStudent(studentId);

        }


        /*
         * Escape HTML
         */
        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
         * Logout
         */
        async function logout() {

            try {

                stopCamera();

                await auth.signOut();

                window.location.href = "index.html";

            } catch (error) {

                console.error(error);

            }

        }

    </script>

</body>

</html>
