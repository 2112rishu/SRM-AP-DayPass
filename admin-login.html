<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Staff Login | SRM AP EntryPass</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(109, 74, 255, .20), transparent 35%),
                radial-gradient(circle at bottom right, rgba(255, 122, 200, .18), transparent 35%),
                #f7f7fc;
        }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            background: rgba(255,255,255,.94);
            border-radius: 28px;
            padding: 38px;
            box-shadow: 0 25px 70px rgba(50,40,100,.14);
        }

        .brand-icon {
            width: 70px;
            height: 70px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            background: linear-gradient(135deg,#6d4aff,#9b7cff);
            color: white;
            font-size: 30px;
        }

        .role-box {
            background: #f5f3ff;
            border: 1px solid #e5dfff;
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 14px;
            padding: 13px 15px;
        }

        .login-btn {
            border: 0;
            border-radius: 14px;
            padding: 13px;
            font-weight: 700;
            background: linear-gradient(135deg,#6d4aff,#8c68ff);
            color: white;
        }

        .login-btn:hover {
            transform: translateY(-1px);
            color: white;
        }

        .password-wrap {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: none;
        }
    </style>
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="text-center mb-4">

            <div class="brand-icon mb-3">
                <i class="bi bi-shield-lock-fill"></i>
            </div>

            <h2 class="fw-bold mb-1">Staff Portal</h2>

            <p class="text-muted mb-0">
                SRM AP EntryPass Administration
            </p>

        </div>

        <div class="role-box">
            <div class="fw-bold">
                <i class="bi bi-shield-check me-2"></i>
                Authorized Staff Only
            </div>

            <small class="text-muted">
                Admin, Security Admin and Super Admin accounts can access this portal.
            </small>
        </div>

        <div id="errorBox"
             class="alert alert-danger d-none">
        </div>

        <form id="loginForm">

            <div class="mb-3">

                <label class="form-label fw-semibold">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="staff@srmist.edu.in"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label fw-semibold">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

            </div>

            <button
                type="submit"
                id="loginBtn"
                class="btn login-btn w-100">

                <i class="bi bi-box-arrow-in-right me-2"></i>
                Sign In

            </button>

        </form>

        <div class="text-center mt-4">

            <a href="index.html"
               class="text-decoration-none">

                <i class="bi bi-arrow-left me-1"></i>
                Back to EntryPass

            </a>

        </div>

    </div>

</div>

<script type="module">

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

/*
 IMPORTANT:
 Use the SAME Firebase web configuration
 as your student-login.html.
*/

const firebaseConfig = {
  apiKey: "AIzaSyCu8XDAIBqIVp_49ta4383TP4xdP-n2sbw",
  authDomain: "srm-ap-daypass.firebaseapp.com",
  databaseURL: "https://srm-ap-daypass-default-rtdb.firebaseio.com",
  projectId: "srm-ap-daypass",
  storageBucket: "srm-ap-daypass.firebasestorage.app",
  messagingSenderId: "40857485563",
  appId: "1:40857485563:web:0f4dd9058d3cf451b8705e",
  measurementId: "G-WDYKW0TBFE"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("errorBox");
const loginBtn = document.getElementById("loginBtn");

document.getElementById("togglePassword").addEventListener("click", () => {

    const password = document.getElementById("password");
    const icon = document.querySelector("#togglePassword i");

    if (password.type === "password") {
        password.type = "text";
        icon.className = "bi bi-eye-slash";
    } else {
        password.type = "password";
        icon.className = "bi bi-eye";
    }

});

function showError(message) {

    errorBox.textContent = message;
    errorBox.classList.remove("d-none");

}

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    errorBox.classList.add("d-none");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    loginBtn.disabled = true;

    loginBtn.innerHTML =
        '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

    try {

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        const token =
            await credential.user.getIdToken(true);

        const response =
            await fetch("/api/me", {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            });

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Unable to load account."
            );
        }

        const role = data.user.role;

        const allowedRoles = [
            "SECURITY",
            "ADMIN",
            "SUPER_ADMIN"
        ];

        if (!allowedRoles.includes(role)) {

            throw new Error(
                "This account does not have staff access."
            );

        }

        sessionStorage.setItem(
            "entrypass_token",
            token
        );

        sessionStorage.setItem(
            "entrypass_user",
            JSON.stringify(data.user)
        );

        /*
          Route according to role.
        */

        if (role === "SECURITY") {

            window.location.href = "security.html";

        } else if (role === "ADMIN") {

            window.location.href = "admin-dashboard.html";

        } else if (role === "SUPER_ADMIN") {

            window.location.href = "super-admin-management.html";

        }

    } catch (error) {

        console.error(error);

        showError(
            error.message ||
            "Login failed. Please check your credentials."
        );

        loginBtn.disabled = false;

        loginBtn.innerHTML =
            '<i class="bi bi-box-arrow-in-right me-2"></i>Sign In';

    }

});

</script>

</body>
</html>
