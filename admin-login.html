<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - SRM AP DayPass</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="firebase-config.js"></script>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand fw-bold">
            🛡️ SRM AP DayPass - Admin
        </span>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body p-5">

                    <div class="text-center mb-4">

                        <div style="font-size: 55px;">
                            🛡️
                        </div>

                        <h2 class="fw-bold">
                            Admin Login
                        </h2>

                        <p class="text-muted">
                            SRM AP DayPass Management System
                        </p>

                    </div>

                    <div
                        id="message"
                        class="alert d-none"
                        role="alert"
                    ></div>

                    <form id="adminLoginForm">

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label fw-semibold"
                            >
                                Admin Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter admin email"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            id="loginButton"
                            class="btn btn-dark w-100"
                        >
                            Admin Login
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <a href="index.html" class="text-decoration-none">
                            ← Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<script>

console.log("🔥 NEW ADMIN LOGIN FILE LOADED");

const form = document.getElementById("adminLoginForm");
const message = document.getElementById("message");
const loginButton = document.getElementById("loginButton");

function showMessage(text, type = "danger") {

    message.className = "alert alert-" + type;
    message.textContent = text;
    message.classList.remove("d-none");

}

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    console.log("🔥 Login button clicked");

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    if (!email || !password) {

        showMessage("Please enter email and password.");

        return;

    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    message.classList.add("d-none");

    try {

        /*
         * STEP 1
         * Login with Firebase Authentication
         */

        const result =
            await auth.signInWithEmailAndPassword(
                email,
                password
            );

        const user = result.user;

        console.log(
            "🔥 Firebase UID:",
            user.uid
        );

        console.log(
            "🔥 Firebase Email:",
            user.email
        );


        /*
         * STEP 2
         * Find admin profile using Firebase UID
         */

        const documentSnapshot =
            await db
                .collection("students")
                .doc(user.uid)
                .get();

        console.log(
            "🔥 Firestore document exists:",
            documentSnapshot.exists
        );


        if (!documentSnapshot.exists) {

            await auth.signOut();

            throw new Error(
                "Admin profile was not found in Firestore. " +
                "The students document ID must exactly match the Firebase UID."
            );

        }


        /*
         * STEP 3
         * Read profile
         */

        const profile =
            documentSnapshot.data();

        console.log(
            "🔥 Firestore profile:",
            profile
        );

        console.log(
            "🔥 Role received:",
            profile.role
        );


        /*
         * STEP 4
         * Check admin role
         */

        if (profile.role !== "admin") {

            await auth.signOut();

            throw new Error(
                "This account is not an admin account. " +
                "Current role: " +
                profile.role
            );

        }


        /*
         * STEP 5
         * Check account status
         */

        if (
            profile.accountStatus &&
            profile.accountStatus !== "ACTIVE"
        ) {

            await auth.signOut();

            throw new Error(
                "This admin account is not active."
            );

        }


        /*
         * STEP 6
         * Login successful
         */

        console.log(
            "✅ ADMIN LOGIN SUCCESS"
        );

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );

        setTimeout(function() {

            window.location.href =
                "admin.html";

        }, 500);

    }

    catch (error) {

        console.error(
            "❌ ADMIN LOGIN ERROR:",
            error
        );

        showMessage(
            error.message ||
            "Admin login failed."
        );

        loginButton.disabled = false;
        loginButton.textContent = "Admin Login";

    }

});

</script>

</body>
</html>
