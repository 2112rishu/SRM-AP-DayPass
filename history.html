<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry History - SRM AP DayPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">🎓 SRM AP DayPass</a>
        <div class="ms-auto d-flex gap-2">
            <a href="dashboard.html" class="btn btn-outline-primary btn-sm">Dashboard</a>
            <button class="btn btn-primary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container page-wrap">
    <div class="panel">
        <h1>My Entry History</h1>
        <p id="studentInfo" class="small-muted">Loading...</p>

        <div id="message"></div>

        <div class="table-responsive mt-4">
            <table class="table table-bordered align-middle">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Entry Type</th>
                        <th>Verified</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr>
                        <td colspan="4" class="text-center">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script>
async function loadHistory() {
    try {
        await requireRole("student");

        const data = await getMyProfile();
        const profile = data.profile;

        document.getElementById("studentInfo").textContent =
            `${profile.name} • ${profile.studentId}`;

        const result = await apiRequest(
            `/api/entries/${encodeURIComponent(profile.studentId)}`
        );

        const body = document.getElementById("historyBody");

        if (!result.entries.length) {
            body.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center text-muted">
                        No entries recorded yet.
                    </td>
                </tr>
            `;
            return;
        }

        body.innerHTML = result.entries.map(entry => `
            <tr>
                <td>${escapeHtml(entry.date || "-")}</td>
                <td>${escapeHtml(entry.time || "-")}</td>
                <td>${escapeHtml(entry.entryType || "ENTRY")}</td>
                <td><span class="status-badge status-active">Verified</span></td>
            </tr>
        `).join("");

    } catch (error) {
        console.error(error);
        document.getElementById("message").innerHTML =
            `<div class="alert alert-danger">${escapeHtml(error.message)}</div>`;
    }
}

loadHistory();
</script>

</body>
</html>
