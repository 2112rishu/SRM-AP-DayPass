<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - SRM AP DayPass</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex align-items-center">
        <a class="navbar-brand" href="dashboard.html">🎓 SRM AP DayPass</a>
        <div class="ms-auto d-flex gap-2">
            <a href="history.html" class="btn btn-outline-primary btn-sm">History</a>
            <button class="btn btn-primary btn-sm" onclick="logout()">Logout</button>
        </div>
    </div>
</nav>

<main class="container page-wrap">
    <div class="welcome">
        <h1 id="welcomeName">Student Dashboard</h1>
        <p id="studentDetails" class="mb-0">Loading student details...</p>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="qr-card">
                <h2>Your Digital DayPass</h2>
                <p class="small-muted">
                    Show this QR code to the security/admin desk.
                    It refreshes every 30 seconds.
                </p>

                <div id="qrContainer" class="qr-container"></div>

                <div class="qr-timer">
                    QR refreshes in <span id="timer">30</span> seconds
                </div>

                <div id="qrStatus" class="small-muted mt-2"></div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="panel h-100">
                <h3>Student Information</h3>
                <hr>
                <p><strong>Student ID:</strong> <span id="studentId">-</span></p>
                <p><strong>Email:</strong> <span id="email">-</span></p>
                <p><strong>Status:</strong> <span id="status">-</span></p>

                <a href="history.html" class="btn btn-primary w-100">
                    View Entry History
                </a>
            </div>
        </div>
    </div>
</main>

<script>
let student = null;
let timerInterval = null;

async function loadDashboard() {
    try {
        await requireRole("student");

        const data = await getMyProfile();
        student = data.profile;

        document.getElementById("welcomeName").textContent =
            `Welcome, ${student.name}`;

        document.getElementById("studentDetails").textContent =
            `${student.studentId} • ${student.status || "Student"}`;

        document.getElementById("studentId").textContent = student.studentId;
        document.getElementById("email").textContent = student.email;
        document.getElementById("status").innerHTML =
            `<span class="status-badge status-active">${escapeHtml(student.accountStatus)}</span>`;

        generateQr();
    } catch (error) {
        console.error(error);
    }
}

function generateQr() {
    const container = document.getElementById("qrContainer");
    container.innerHTML = "";

    const encodedStudentId = btoa(student.studentId);
    const timeSlot = Math.floor(Date.now() / 1000 / 30);
    const qrData = `SRMAP|${encodedStudentId}|${timeSlot}`;

    new QRCode(container, {
        text: qrData,
        width: 230,
        height: 230,
        correctLevel: QRCode.CorrectLevel.M
    });

    document.getElementById("qrStatus").textContent =
        "QR code is active and ready for verification.";

    startTimer();
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);

    function update() {
        const secondsIntoSlot = Math.floor(Date.now() / 1000) % 30;
        const remaining = 30 - secondsIntoSlot;

        document.getElementById("timer").textContent = remaining;

        if (remaining === 30 || remaining <= 1) {
            generateQr();
        }
    }

    update();
    timerInterval = setInterval(update, 1000);
}

loadDashboard();
</script>

</body>
</html>
